<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 1180" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/>
    </marker>
    <g id="gnd">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#111827" stroke-width="2"/>
      <line x1="-10" y1="10" x2="10" y2="10" stroke="#111827" stroke-width="2"/>
      <line x1="-6" y1="15" x2="6" y2="15" stroke="#111827" stroke-width="2"/>
      <line x1="-2" y1="20" x2="2" y2="20" stroke="#111827" stroke-width="2"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1650" height="1180" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="34" font-size="26" font-weight="700" fill="#0f172a">DrumLight — Wiring Diagram</text>
  <text x="40" y="58" font-size="13" fill="#475569">Reference wiring for Drum 1 + the optional physical control board. Pin numbers match include/config.h. Full parts list &amp; power budgeting: requirements.md §7–8.</text>

  <!-- +5V rail -->
  <line x1="190" y1="90" x2="1490" y2="90" stroke="#dc2626" stroke-width="3"/>
  <text x="700" y="80" font-size="13" fill="#dc2626" font-weight="600">+5V RAIL — shared supply (Option A, requirements.md §8.2)</text>

  <!-- PSU -->
  <g>
    <rect x="40" y="110" width="150" height="90" rx="10" fill="#eef2f7" stroke="#334155" stroke-width="2"/>
    <text x="115" y="140" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">External 5V PSU</text>
    <text x="115" y="160" font-size="11" fill="#475569" text-anchor="middle">Sized for LED load +</text>
    <text x="115" y="174" font-size="11" fill="#475569" text-anchor="middle">~800mA ESP32 headroom</text>
    <line x1="190" y1="135" x2="190" y2="90" stroke="#dc2626" stroke-width="3"/>
    <circle cx="190" cy="135" r="4" fill="#dc2626"/>
    <text x="196" y="128" font-size="11" fill="#dc2626">+5V</text>
    <line x1="90" y1="200" x2="90" y2="215" stroke="#111827" stroke-width="2"/>
    <use href="#gnd" x="90" y="215"/>
  </g>

  <!-- ESP32 -->
  <g>
    <rect x="330" y="110" width="230" height="560" rx="12" fill="#eef2f7" stroke="#334155" stroke-width="2.5"/>
    <text x="445" y="140" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">ESP32 Dev Board</text>
    <text x="445" y="158" font-size="11" fill="#475569" text-anchor="middle">(Arduino framework, PlatformIO)</text>

    <!-- left pins: power -->
    <line x1="330" y1="170" x2="300" y2="170" stroke="#dc2626" stroke-width="2.5"/>
    <circle cx="330" cy="170" r="4" fill="#dc2626"/>
    <line x1="300" y1="170" x2="300" y2="90" stroke="#dc2626" stroke-width="2.5"/>
    <text x="220" y="166" font-size="12" fill="#0f172a" text-anchor="end">5V IN</text>

    <line x1="330" y1="212" x2="280" y2="212" stroke="#111827" stroke-width="2"/>
    <circle cx="330" cy="212" r="4" fill="#111827"/>
    <use href="#gnd" x="270" y="212"/>
    <text x="220" y="208" font-size="12" fill="#0f172a" text-anchor="end">GND</text>

    <line x1="330" y1="254" x2="300" y2="254" stroke="#c2410c" stroke-width="2"/>
    <circle cx="330" cy="254" r="4" fill="#c2410c"/>
    <text x="40" y="250" font-size="12" fill="#0f172a" text-anchor="start">3V3 OUT (net "3V3")</text>

    <!-- right pins: signals -->
    <g font-size="12" fill="#0f172a">
      <circle cx="560" cy="296" r="4" fill="#2563eb"/>
      <text x="452" y="292" text-anchor="end">GPIO32 → Mic 1 signal</text>

      <circle cx="560" cy="338" r="4" fill="#0d9488"/>
      <text x="452" y="334" text-anchor="end">GPIO16 → Drum 1 LED data</text>

      <circle cx="560" cy="380" r="4" fill="#7c3aed"/>
      <text x="452" y="376" text-anchor="end">GPIO23 → Power switch</text>

      <circle cx="560" cy="422" r="4" fill="#7c3aed"/>
      <text x="452" y="418" text-anchor="end">GPIO25 → Global test button</text>

      <circle cx="560" cy="464" r="4" fill="#7c3aed"/>
      <text x="452" y="460" text-anchor="end">GPIO26 → Preset button 1</text>

      <circle cx="560" cy="506" r="4" fill="#7c3aed"/>
      <text x="452" y="502" text-anchor="end">GPIO27 → Preset button 2</text>

      <circle cx="560" cy="548" r="4" fill="#7c3aed"/>
      <text x="452" y="544" text-anchor="end">GPIO14 → Preset button 3</text>

      <circle cx="560" cy="590" r="4" fill="#7c3aed"/>
      <text x="452" y="586" text-anchor="end">GPIO13 → Preset button 4</text>

      <circle cx="560" cy="632" r="4" fill="#7c3aed"/>
      <text x="452" y="628" text-anchor="end">GPIO4 → Preset button 5</text>
    </g>
    <text x="445" y="660" font-size="10.5" fill="#64748b" text-anchor="middle">Drums 2–4: repeat mic+LED block on LED_PIN_1..3 / mic 33,34,35 (see config.h)</text>
  </g>

  <!-- Mic module -->
  <g>
    <rect x="650" y="250" width="190" height="80" rx="10" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
    <text x="745" y="275" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">MAX4466 Mic — Drum 1</text>
    <text x="745" y="292" font-size="10.5" fill="#475569" text-anchor="middle">onboard gain trimpot ~midway</text>
    <line x1="650" y1="296" x2="560" y2="296" stroke="#2563eb" stroke-width="2.5"/>
    <text x="660" y="312" font-size="10.5" fill="#0f172a">OUT</text>
    <text x="820" y="262" font-size="10.5" fill="#c2410c" text-anchor="end">VCC (net "3V3")</text>
    <use href="#gnd" x="745" y="330"/>
    <text x="745" y="352" font-size="10.5" fill="#0f172a" text-anchor="middle">GND</text>
  </g>

  <!-- Level shifter -->
  <g>
    <rect x="650" y="345" width="190" height="74" rx="10" fill="#eefdfb" stroke="#334155" stroke-width="2"/>
    <text x="745" y="368" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">74AHCT125</text>
    <text x="745" y="384" font-size="10.5" fill="#475569" text-anchor="middle">level shifter, 3.3V→5V logic</text>
    <line x1="560" y1="338" x2="620" y2="338" stroke="#0d9488" stroke-width="2.5"/>
    <line x1="620" y1="338" x2="620" y2="382" stroke="#0d9488" stroke-width="2.5"/>
    <line x1="620" y1="382" x2="650" y2="382" stroke="#0d9488" stroke-width="2.5"/>
    <text x="825" y="360" font-size="10.5" fill="#dc2626" text-anchor="end">VCC (net "+5V")</text>
    <use href="#gnd" x="745" y="419"/>
    <text x="745" y="441" font-size="10.5" fill="#0f172a" text-anchor="middle">GND</text>
  </g>

  <!-- resistor -->
  <g stroke="#0d9488" stroke-width="2.5" fill="none">
    <line x1="840" y1="382" x2="855" y2="382"/>
    <polyline points="855,382 862,368 876,396 890,368 904,396 911,382"/>
    <line x1="911" y1="382" x2="928" y2="382"/>
  </g>
  <text x="882" y="412" font-size="10.5" fill="#0f172a" text-anchor="middle">300–500Ω</text>
  <line x1="928" y1="382" x2="1000" y2="382" stroke="#0d9488" stroke-width="2.5"/>

  <!-- LED strip -->
  <g>
    <rect x="1000" y="300" width="280" height="150" rx="10" fill="#fff7ed" stroke="#334155" stroke-width="2"/>
    <text x="1140" y="326" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">WS2812B LED Strip — Drum 1</text>
    <text x="1140" y="343" font-size="10.5" fill="#475569" text-anchor="middle">length = however much wraps the shell</text>
    <text x="1140" y="358" font-size="10.5" fill="#475569" text-anchor="middle">inject power at both ends if &gt;2m / 60 LEDs (§8.3)</text>
    <text x="1010" y="392" font-size="10.5" fill="#0f172a">DIN</text>

    <line x1="1140" y1="300" x2="1140" y2="90" stroke="#dc2626" stroke-width="3"/>
    <circle cx="1140" cy="300" r="4" fill="#dc2626"/>
    <text x="1148" y="316" font-size="10.5" fill="#dc2626">5V</text>

    <use href="#gnd" x="1140" y="450"/>
    <text x="1140" y="472" font-size="10.5" fill="#0f172a" text-anchor="middle">GND</text>
  </g>

  <!-- input capacitor -->
  <g stroke="#0f172a" stroke-width="2">
    <line x1="960" y1="415" x2="982" y2="415"/>
    <line x1="960" y1="430" x2="982" y2="430"/>
    <line x1="971" y1="405" x2="971" y2="415" stroke-dasharray="3,3"/>
    <line x1="971" y1="430" x2="971" y2="440" stroke-dasharray="3,3"/>
  </g>
  <text x="971" y="398" font-size="10.5" fill="#0f172a" text-anchor="middle">1000µF</text>
  <text x="971" y="452" font-size="9.5" fill="#64748b" text-anchor="middle">across 5V/GND</text>
  <text x="971" y="463" font-size="9.5" fill="#64748b" text-anchor="middle">at strip input</text>

  <!-- Control board group box -->
  <rect x="600" y="490" width="920" height="290" rx="14" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="1060" y="516" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Physical Control Board (optional)</text>
  <text x="1060" y="533" font-size="10.5" fill="#475569" text-anchor="middle">All inputs active-low to GND — ESP32 internal pull-ups, no external resistors needed</text>

  <!-- routing wires row6 (power switch) and row7 (test) detour under the LED cluster -->
  <polyline points="560,380 598,380 598,470 1343,470 1343,650" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <polyline points="560,422 606,422 606,480 1226,480 1226,650" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <!-- rows 8-12 direct -->
  <polyline points="560,464 1460,464 1460,650" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <polyline points="560,506 1110,506 1110,650" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <polyline points="560,548 993,548 993,650" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <polyline points="560,590 877,590 877,650" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <polyline points="560,632 760,632 760,650" fill="none" stroke="#7c3aed" stroke-width="2"/>

  <!-- switch symbols -->
  <g font-size="10.5" fill="#0f172a" text-anchor="middle">
    <!-- power switch (maintained SPST) x=1343 -->
    <g>
      <line x1="1343" y1="650" x2="1343" y2="665" stroke="#7c3aed" stroke-width="2"/>
      <line x1="1343" y1="665" x2="1358" y2="678" stroke="#7c3aed" stroke-width="2"/>
      <circle cx="1343" cy="665" r="2.5" fill="#7c3aed"/>
      <circle cx="1358" cy="690" r="2.5" fill="#7c3aed"/>
      <line x1="1358" y1="690" x2="1358" y2="700" stroke="#7c3aed" stroke-width="2"/>
      <use href="#gnd" x="1358" y="700"/>
      <text x="1343" y="730">Power switch</text>
      <text x="1343" y="744">(maintained)</text>
      <text x="1343" y="758">GPIO23</text>
    </g>
    <!-- test button x=1226 -->
    <g>
      <line x1="1226" y1="650" x2="1226" y2="665" stroke="#7c3aed" stroke-width="2"/>
      <rect x="1216" y="665" width="20" height="12" rx="2" fill="none" stroke="#7c3aed" stroke-width="2"/>
      <line x1="1226" y1="677" x2="1226" y2="700" stroke="#7c3aed" stroke-width="2"/>
      <use href="#gnd" x="1226" y="700"/>
      <text x="1226" y="730">Test all</text>
      <text x="1226" y="744">(momentary)</text>
      <text x="1226" y="758">GPIO25</text>
    </g>
    <!-- preset buttons -->
    <g>
      <line x1="1460" y1="650" x2="1460" y2="665" stroke="#7c3aed" stroke-width="2"/>
      <rect x="1450" y="665" width="20" height="12" rx="2" fill="none" stroke="#7c3aed" stroke-width="2"/>
      <line x1="1460" y1="677" x2="1460" y2="700" stroke="#7c3aed" stroke-width="2"/>
      <use href="#gnd" x="1460" y="700"/>
      <text x="1460" y="730">Preset 1</text>
      <text x="1460" y="744">(momentary)</text>
      <text x="1460" y="758">GPIO26</text>
    </g>
    <g>
      <line x1="1110" y1="650" x2="1110" y2="665" stroke="#7c3aed" stroke-width="2"/>
      <rect x="1100" y="665" width="20" height="12" rx="2" fill="none" stroke="#7c3aed" stroke-width="2"/>
      <line x1="1110" y1="677" x2="1110" y2="700" stroke="#7c3aed" stroke-width="2"/>
      <use href="#gnd" x="1110" y="700"/>
      <text x="1110" y="730">Preset 2</text>
      <text x="1110" y="744">(momentary)</text>
      <text x="1110" y="758">GPIO27</text>
    </g>
    <g>
      <line x1="993" y1="650" x2="993" y2="665" stroke="#7c3aed" stroke-width="2"/>
      <rect x="983" y="665" width="20" height="12" rx="2" fill="none" stroke="#7c3aed" stroke-width="2"/>
      <line x1="993" y1="677" x2="993" y2="700" stroke="#7c3aed" stroke-width="2"/>
      <use href="#gnd" x="993" y="700"/>
      <text x="993" y="730">Preset 3</text>
      <text x="993" y="744">(momentary)</text>
      <text x="993" y="758">GPIO14</text>
    </g>
    <g>
      <line x1="877" y1="650" x2="877" y2="665" stroke="#7c3aed" stroke-width="2"/>
      <rect x="867" y="665" width="20" height="12" rx="2" fill="none" stroke="#7c3aed" stroke-width="2"/>
      <line x1="877" y1="677" x2="877" y2="700" stroke="#7c3aed" stroke-width="2"/>
      <use href="#gnd" x="877" y="700"/>
      <text x="877" y="730">Preset 4</text>
      <text x="877" y="744">(momentary)</text>
      <text x="877" y="758">GPIO13</text>
    </g>
    <g>
      <line x1="760" y1="650" x2="760" y2="665" stroke="#7c3aed" stroke-width="2"/>
      <rect x="750" y="665" width="20" height="12" rx="2" fill="none" stroke="#7c3aed" stroke-width="2"/>
      <line x1="760" y1="677" x2="760" y2="700" stroke="#7c3aed" stroke-width="2"/>
      <use href="#gnd" x="760" y="700"/>
      <text x="760" y="730">Preset 5</text>
      <text x="760" y="744">(momentary)</text>
      <text x="760" y="758">GPIO4</text>
    </g>
  </g>

  <!-- Legend -->
  <g font-size="11.5" fill="#0f172a">
    <rect x="40" y="830" width="1570" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="60" y="856" font-size="13" font-weight="700">Legend</text>

    <line x1="60" y1="878" x2="95" y2="878" stroke="#dc2626" stroke-width="3"/>
    <text x="103" y="882">+5V power</text>

    <line x1="220" y1="878" x2="255" y2="878" stroke="#111827" stroke-width="2"/>
    <text x="263" y="882">GND wire</text>
    <use href="#gnd" x="345" y="874"/>
    <text x="365" y="882">common ground symbol</text>

    <line x1="560" y1="878" x2="595" y2="878" stroke="#2563eb" stroke-width="2.5"/>
    <text x="603" y="882">analog mic signal</text>

    <line x1="740" y1="878" x2="775" y2="878" stroke="#0d9488" stroke-width="2.5"/>
    <text x="783" y="882">LED data (via level shifter)</text>

    <line x1="1000" y1="878" x2="1035" y2="878" stroke="#7c3aed" stroke-width="2"/>
    <text x="1043" y="882">button / switch input (active-low)</text>

    <text x="1310" y="882" fill="#c2410c">3V3</text>
    <text x="1345" y="882" font-size="10.5">= same net, both ends tied together</text>

    <text x="60" y="906" font-size="11" fill="#475569">⏚ All ground symbols (ESP32, mic, LED strip, PSU, control board) tie to one common ground point/bus — a floating ground is the #1 cause of noisy triggers &amp; corrupted LED data (N4).</text>
    <text x="60" y="924" font-size="11" fill="#475569">Only Drum 1's mic + LED chain is shown. For Drums 2–4, repeat the mic → GPIO + level shifter → resistor → strip block on LED_PIN_1/2/3 and mic pins 33/34/35 (config.h DRUMS[]).</text>
    <text x="60" y="942" font-size="11" fill="#475569">Power option shown: Option A, single shared 5V rail (§8.2). For a longer/brighter build, Option B splits the LEDs onto their own PSU — see requirements.md for when to switch.</text>
  </g>
</svg>
